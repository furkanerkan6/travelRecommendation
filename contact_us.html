<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom | Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="overlay">
  <nav>
    <a class="logo" href="travel_recommendation.html">TravelBloom</a>
    <ul class="nav-links">
      <li><a href="travel_recommendation.html">Home</a></li>
      <li><a href="about_us.html">About Us</a></li>
      <li><a href="contact_us.html">Contact Us</a></li>
    </ul>
  </nav>
  <section class="page">
    <h1>Contact Us</h1>
    <p>Email: info@travelbloom.com<br>Phone: +1 (555) 123-4567<br>Address: 123 Explorer Street, Wanderlust City</p>
    <form id="contactForm">
      <input type="text" id="name" placeholder="Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <textarea id="message" rows="5" placeholder="Message" required></textarea>
      <button type="submit" class="btn">Submit</button>
    </form>
    <p id="formMsg" style="margin-top:12px"></p>
  </section>
</div>
<script>
document.getElementById('contactForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const message = document.getElementById('message').value;
  window.location.href = 'mailto:info@travelbloom.com?subject=' + encodeURIComponent('Message from ' + name) +
    '&body=' + encodeURIComponent(message + '\n\nFrom: ' + name + ' <' + email + '>');
  document.getElementById('formMsg').textContent = 'Thank you, ' + name + '! Your email client has been opened.';
  this.reset();
});
</script>
</body>
</html>
